[tox]
isolated_build = true
skipsdist = true

[testenv]
deps =
    red-discordbot[dev] @ git+https://github.com/Cog-Creators/Red-DiscordBot@{env:RED_DISCORDBOT_BRANCH:V3/develop}
    -r "{env:COG_REQUIREMENTS_TXT:requirements.txt}"
commands =
    pytest -c "{env:PYTEST_INI:pytest.ini}" "{env:COG_PATH}" {posargs}

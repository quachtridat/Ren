name: Cog Unit Tests

on:
  push:
    branches:
      - V3/develop
      - V3/testing
      - V3/prod
  pull_request:
    branches:
      - V3/develop
      - V3/testing
      - V3/prod
  workflow_dispatch:
    inputs:
      cogs:
        description: "Comma-separated list of cogs to test (leave blank for all)"
        required: false
        default: ""

env:
  COGS_PATH: "${{ github.workspace }}/cogs"
  PYTEST_INI_PATH: "${{ github.workspace }}/.github/workflows/configs/cog_unit_test_pytest.ini"
  RED_DISCORDBOT_BRANCH: "3.5.16"
  TOX_INI_PATH: "${{ github.workspace }}/.github/workflows/configs/cog_unit_test_tox.ini"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Capture workflow_dispatch input
        id: handle-input
        run: |
          if [ -n "${{ github.event.inputs.cogs }}" ]; then
            echo "cogs_input=${{ github.event.inputs.cogs }}" >> $GITHUB_OUTPUT
          else
            echo "cogs_input=" >> $GITHUB_OUTPUT
          fi

      - name: List available cogs
        run: ls "${COGS_PATH}" | sed "s#/##" > all_cogs.txt

      - name: Split input into lines
        if: steps.handle-input.outputs.cogs_input != ''
        run: |
          echo "${{ steps.handle-input.outputs.cogs_input }}" | tr "," "\n" > input_cogs.txt

      - name: Validate cog names
        if: steps.handle-input.outputs.cogs_input != ''
        run: |
          invalid=$(grep -vxFf all_cogs.txt input_cogs.txt || true)
          if [ -n "$invalid" ]; then
            echo "Invalid cog(s): $invalid"
            echo "Available cogs:"
            cat all_cogs.txt
            exit 1
          fi

      - name: Build cog list
        run: |
          if [ -s input_cogs.txt ]; then
            cp input_cogs.txt coglist.txt
          else
            cp all_cogs.txt coglist.txt
          fi

      - name: Convert cog list to JSON
        run: jq -Rsc 'split("\n")[:-1]' coglist.txt > coglist.json

      - name: Set matrix output
        id: set-matrix
        run: echo "matrix={\"cog\":$(cat coglist.json)}" >> $GITHUB_OUTPUT

      - name: Print final matrix
        run: |
          echo "Cogs to test:"
          cat coglist.json

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        cog: ${{ fromJson(needs.discover.outputs.matrix).cog }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip + tox
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .tox/${{ matrix.cog }}
          key: "${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.cog }}-${{ hashFiles(format('cogs/{0}/.requirements.txt', matrix.cog)) }}"
          restore-keys: "${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.cog }}-"

      - name: Install dependencies
        run: pip install "jq" "tox"

      - name: Extract cog requirements
        run: |
          if [ -f "${COGS_PATH}/${{ matrix.cog }}/info.json" ]; then
            jq -r ".requirements[]? // empty" "${COGS_PATH}/${{ matrix.cog }}/info.json" > "${COGS_PATH}/${{ matrix.cog }}/.requirements.txt"
          else
            touch "${COGS_PATH}/${{ matrix.cog }}/.requirements.txt"
          fi

      - name: Run tox
        env:
          COG_PATH: "${{ env.COGS_PATH }}/${{ matrix.cog }}"
          COG_REQUIREMENTS_TXT: "${{ env.COGS_PATH }}/${{ matrix.cog }}/.requirements.txt"
          PYTEST_INI: "${{ env.PYTEST_INI_PATH }}"
          RED_DISCORDBOT_BRANCH: "${{ env.RED_DISCORDBOT_BRANCH }}"
        run: tox -c "${{ env.TOX_INI_PATH }}"
